name: Generate extension icons

# PNG 图标是二进制文件，无法通过文本文件接口推送；
# 该工作流在首次推送（或图标生成脚本/清单变化）后自动生成 icons/*.png 并提交。

on:
  push:
    paths:
      - 'scripts/make-icons.js'
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icons
        run: node scripts/make-icons.js

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- icons)" ]; then
            git add icons
            git commit -m "chore: generate extension icons"
            git push
          else
            echo "icons unchanged"
          fi
